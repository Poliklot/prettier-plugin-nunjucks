name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to publish. Leave empty to run Release Please.
        required: false
        type: string
      version:
        description: Expected package version for a manual publish.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Create release PR or GitHub release
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag_name == '' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publish npm package
    needs: release-please
    if: >-
      ${{
        always() &&
        (
          needs.release-please.outputs.release_created == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        )
      }}
    uses: ./.github/workflows/publish-npm.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag_name: ${{ inputs.tag_name || needs.release-please.outputs.tag_name }}
      version: ${{ inputs.version || needs.release-please.outputs.version }}
